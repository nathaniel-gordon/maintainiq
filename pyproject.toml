[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pme"
version = "2.0.0"
description = "Predictive maintenance as an event-time stream: watermarks, windows, operators, sinks"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "joblib",
]

[project.scripts]
pme = "pme.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src/ layout: tests import `pme` without requiring an editable install.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: end-to-end runs over the full seeded fleet"]
