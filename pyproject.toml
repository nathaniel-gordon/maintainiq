[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pme"
version = "2.2.0"
description = "Predictive maintenance as an event-time stream: watermarks, windows, operators, sinks"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
pme = "pme.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src/ layout: tests import `pme` without requiring an editable install.
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: end-to-end runs over the full seeded fleet"]
# A leaked sqlite handle is a bug, not a note: the HTTP server opens one per
# thread and used to keep every one of them.
filterwarnings = ["error::ResourceWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ISC", "FURB", "PLE", "PLW", "PLR"]
ignore = [
    "PLR0913",  # operators and sinks legitimately take several tuning knobs
    "PLR2004",  # magic values in tests and threshold checks read fine inline
    "PLR0912",  # branch-heavy request routing and validation are clearer flat
    "PLR0915",
    "PLR0917",  # ports take their tuning knobs positionally by long-standing convention
    "PLR0911",  # request routing reads better as a flat sequence of matches
    "B027",     # Sink.open/close/restore are deliberately optional hooks, not abstract
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "matplotlib.*", "pandas.*", "scipy.*"]
ignore_missing_imports = true
